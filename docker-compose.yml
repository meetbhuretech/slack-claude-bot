services:
  assistant:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - assistant-data:/data
      - ${TARGET_REPO_PATH}:/repo
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      TARGET_REPO_PATH: /repo
      PUBLIC_BASE_URL: http://localhost:3000
    restart: unless-stopped

volumes:
  assistant-data:
